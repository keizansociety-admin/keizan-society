title: SHAVING VERSE
body: |
  While shaving the head, the Bodhisattva inspires all beings to leave behind afflictions forever and attain the ultimate peace. *Bow three times to bathroom altar.*

  *The Sotoshu Gyoji Kihan writes, "When finished shaving, cut fingernails and toenails, and bury them together with hair in a predetermined place (a place where people will not walk on them, such as a hair reliquary or the roots of plants, etc.)."*
