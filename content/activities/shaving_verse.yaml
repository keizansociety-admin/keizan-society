title: "VERSE OF SHAVING"
body: |
  *Recite with hands in gassho:* “In shaving off beard and hair, 
we pray that all living beings
 should forever be free from mental afflictions 
and in the end attain nirvana." *Bow three times to bathroom altar.*
  
  *The Sotoshu Gyoji Kihan writes, "When finished shaving, cut fingernails and toenails, and bury them together
 with hair in a predetermined place (a place where people will not 
walk on them, such as a hair reliquary or the roots of plants, etc.)."*