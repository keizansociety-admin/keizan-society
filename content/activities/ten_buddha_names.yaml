title: "TEN BUDDHA NAMES"
body: |
  "Vairochana Buddha, pure Dharmakaya; Lochana Buddha, complete Sambhogakaya; Shakyamuni Buddha, myriad Nirmanakaya; Maitreya Buddha, of future birth; all buddhas throughout space and time; Lotus of the Wondrous Dharma, Mahayana sutra; Manjushri Bodhisattva, great wisdom; Samantabhadra Bodhisattva, great activity; Avalokiteshvara Bodhisattva, great compassion; all honored ones, bodhisattvas, mahasattvas; wisdom beyond wisdom, maha prajna paramita."