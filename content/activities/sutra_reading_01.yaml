title: "LAY EXHORTATION (DAY 1)"
body: |
  *Sutra-Opening Verse:* The unsurpassed, profound, and wondrous dharma is rarely met with, even in a hundred, thousand, million kalpas. Now we can see and hear it, accept and maintain it. May we unfold the meaning of the Tathagata’s truth.

  **ADVICE ON THE PRACTICE OF ZAZEN (Zazen Yojinki)**
  *by Keizan Jōkin*

  Zazen (seated meditation) allows people to directly enlighten the primordial mind and to abide peacefully in their original state. This is known as realizing one’s original face, or manifesting the true nature of the primordial mind. Zazen is the dropping off of body and mind and remaining detached, whether seated or lying down. It is not concerned with good or evil, and transcends the distinctions of worldly and sacred delusion and enlightenment, sentient beings and Buddhas. It relinquishes the ten thousand things, renounces all conditions, casts aside everything, and does not rely on the six senses.

  What is this that is nameless and cannot be identified with either body or mind? If you try to conceive of it, it is beyond thought; if you try to express it, words are exhausted. It appears both foolish and saintly. It is as high as the mountain and as deep as the ocean, yet discloses neither its full height nor depth. It is illuminatively unbound by conditions, displaying a radiance that cannot be discerned by the naked eye. It penetrates beyond thought and has a clarity above the entanglements of speech. It transcends both heaven and earth and is realized only by the entire person.

  It is like an immeasurably perfected person who has experienced the great death (parinirvana) and has unobstructed vision and unhindered action. What dust defiles it, and what obstacle can block it? Clear water originally has neither front nor back, and empty space is not bound by inside or outside. Zazen has a pristine clarity that is self-illuminating prior to distinctions of form and emptiness, subject and object. It is eternal but has never been named. The Third Patriarch (Sengcan) referred to it as “mind,” and Nagarjuna referred to it as “body.” It manifests the form of Buddha-nature and actualizes the body of all Buddhas. Like the full moon, it is without absence or excess. This mind itself is nothing other than Buddha. Self-illumination shines from the past through the present, realizing the transformation of Nagarjuna and attaining the samadhi of all Buddhas.

  Mind originally is undifferentiated, and the body manifests various forms. Mind-only and body-only cannot be explained in terms of sameness or difference. Mind transforms itself and becomes body, and the manifest body has different forms. When one wave is generated, ten thousand waves appear; when mental discrimination arises, ten thousand dharmas appear. That is, the four elements and five skandhas interdependently originate, and the four limbs and five senses become manifest. Furthermore, the thirty-six parts of the body and the twelve conditions ceaselessly continue to appear. In explaining the interdependence of phenomena, the mind can be compared to ocean water and the body to waves. There are no waves without water, and no water without waves. Water and waves are inseparable, motion and stillness are indistinguishable. Therefore it is said, “The true man who comprehends life and death, coming and going, realizes the imperishable body of the four elements and the five skandhas.”

  Now, practicing zazen is directly entering into the ocean of Buddha-nature and manifesting the body of all Buddhas. The fundamental purity of the radiant mind is disclosed, and the original brightness shines forth without limit. There is no increase or decrease in the waters of the ocean, and the waves are never distracted in their course. Therefore, all Buddhas appear in the world for the single-minded function of causing sentient beings to realize Buddhahood and to attain and manifest enlightenment. Their incomparably tranquil and wondrous technique is known as zazen. It is also known as the self-fulfilling samadhi, or the king of all samadhis.

  *Universal Transference of Merit:* May this merit extend universally to all, so that we together with all beings realize the buddha way.