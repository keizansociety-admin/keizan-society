title: "KANKIN SUTRA READING"
body: |
  *Offer incense and recite Sutra-Opening Verse:* “The unsurpassed, profound, and wondrous Dharma is rarely met with, even in a hundred, thousand, million kalpas. Now we can see and hear it, accept and maintain it. May we unfold the meaning of the Tathagata's truth.”

  *Read Chapter 3 of The Meaning of Practice and Verification (Shushōgi 修證義):* “III. Receiving Precepts and Joining the Ranks

  “11. ◎ Next, we should pay profound respects to the three treasures of buddha, dharma, and sangha. We should vow to make offerings and pay respects to the three treasures even in future lives and bodies. This reverent veneration of buddha, dharma, and sangha is what the buddhas and ancestors in both India and China correctly transmitted.
  
  “12. ◎ Beings of meager fortune and scant virtue are unable even to hear the name of the three treasures; how much less can they take refuge in them. Do not, being compelled by fear, vainly take refuge in mountain spirits or ghosts, or in the shrines of non-Buddhists. Those kinds of refuges do not liberate from sufferings. Quickly taking refuge in the three treasures of buddha, dharma, and sangha will not only bring release from suffering, it will lead to the realization of enlightenment.
  
  “13. In taking refuge in the three treasures, we should have pure faith. Whether during the Tathagata's life­time or after, we place our palms together in gassho, bow our heads, and recite: "We take refuge in buddha, we take refuge in dharma, we take refuge in sangha." We take refuge in the buddha because he is the great teacher. We take refuge in the dharma because it is good medicine. We take refuge in the sangha because it is an excellent friend. It is only by taking refuge in the three treasures that we become disciples of the Buddha. Whatever precepts we receive, they are always taken after the three refuges. Therefore it is in dependence on the three refuges that we gain the precepts. 
  
  “14. The merit of taking refuge in the buddha, dharma, and sangha is always fulfilled when there is a spiritual communication of supplication and response. When there is a spiritual communication of supplication and response, devas, humans, hell dwellers, hungry ghosts, and animals all take refuge. Those who have taken refuge, in life after life, time after time, existence after existence, place after place, will steadily advance, surely accumulate merit, and attain unsurpassed, complete, perfect enlightenment. We should realize that the merit of the threefold refuge is the most honored, the highest, the most profound, and inconceivable. The World­Honored One himself has already borne witness to this, and living beings should believe in it.
  
  “15. Next we should receive the three sets of pure precepts: the precepts of restraining behavior, the precepts of doing good, and the precepts of benefiting living beings. We should then accept the ten grave prohibitions. First, do not kill; second, do not steal; third, do not engage in improper sexual conduct; fourth, do not lie; fifth, do not deal in intoxicants; sixth, do not criticize others; seventh, do not praise self and slander others; eighth, do not be stingy with the dharma or property; ninth, do not give way to anger; and tenth, do not disparage the three treasures. The buddhas all receive and upheld these three refuges, three sets of pure precepts, and ten grave prohibitions.
  
  “16. Next we should receive the three sets of pure precepts: the precepts of restraining behavior, the precepts of doing good, and the precepts of benefiting living beings. We should then accept the ten grave prohibitions. First, do not kill; second, do not steal; third, do not engage in improper sexual conduct; fourth, do not lie; fifth, do not deal in intoxicants; sixth, do not criticize others; seventh, do not praise self and slander others; eighth, do not be stingy with the dharma or property; ninth, do not give way to anger; and tenth, do not disparage the three treasures. The buddhas all receive and upheld these three refuges, three sets of pure precepts, and ten grave prohibitions.
  
  “17. ◎ The buddhas always dwell in this, giving no thought to its various aspects; beings long function in this, the aspects never revealed in their various thoughts. ◎ At this time, the land, grasses and trees, fences and walls, tiles and pebbles, all th1ngs in the dharma realm of the ten directions, perform the work of the buddhas. Therefore, the beings who enjoy the benefits of wind and water thus produced are all mysteriously aided by the wondrous and inconceivable transformative power of buddha, and manifest a personal awakening. ● This is the merit of non-intention, the merit of non-artifice. ● This is arousing the thought of enlightenment.”
 
  *Recite Universal Transference of Merit:* “May this merit extend universally to all, so that we together with all beings realize the Buddha way. Ji ho san shi i shi fu, shi son bu sa mo ko sa, mo ko ho ja ho ro mi.”
