title: "ADMONITION OF IMPERMANENCE"
body: |
  "Since the Great Master Tathagata entered Parinirvana, our lives likewise diminish. Like fish in a shrinking pond, what joy is there in this? We should strive with diligence as if saving our heads from fire. Be mindful of impermanence, and do not be negligent. For the sake of this Great Matter, let us recite the Ten Buddha Names."