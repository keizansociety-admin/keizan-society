title: "KITCHEN SPIRIT EKO"
body: |
  Having recited the Heart of Great Perfect Wisdom Sutra, we dedicate the merit to Daikokuten [or other enshrined object], the kitchen spirit of this household, that he may guard the dharma and protect our family. 

  ◎ All buddhas throughout space and time, all honored ones, bodhisattvas, mahasattvas, ◎ wisdom beyond wisdom, maha-prajnaparamita. ◎