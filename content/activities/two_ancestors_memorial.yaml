title: "TWO ANCESTORS' MEMORIAL"
body: |
  *Recite the Verse in Worship of the Three Venerable Ones:* “Homage to our great benefactor and lord of the doctrine,the Original Teacher Shakyamuni Buddha. Homage to the High Patriarch Dogen. Homage to the Eminent Patriarch Keizan. We gather up and receive your great compassionate pity. May we encounter and obtain it from life to life in every world. Ji ho san shi i shi fu, shi son bu sa mo ko sa, mo ko ho ja ho ro mi.”