title: "DAWN ZAZEN"
body: |
  *Bow to the altar and approach from the left by stepping sideways. Offer fresh water and light the candle. Light a stick of incense, place the foot of the incense to the forehead and offer it to the Buddha, then place it in the incensor. Bow and leave on the right by stepping sideways. Bow to the cushion, turn clockwise, and bow to the room. Sit and turn clockwise, facing the wall. Ring meditation bell three times to begin, and one time to end.*