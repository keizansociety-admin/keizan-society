title: "MIDDAY MEAL"
body: |
  *Before eating, perform the five contemplations with hands in gassho:* “We reflect on the effort that brought us this food and consider how it comes to us. We reflect on our virtue and practice, and whether we are worthy of this offering. We regard greed as the obstacle to freedom of mind. We regard this meal as medicine to sustain our life. For the sake of enlightenment we now receive this food.”
  
  *After eating, recite in gassho:* “Abiding in this ephemeral world like a lotus in muddy water, the mind is pure and goes beyond. Thus we bow to Buddha.” *Bow.*