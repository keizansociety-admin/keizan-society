title: "MIDDAY SUTRA CHANTING"
body: |
  *Chant seven times:* “On boro-n sowaka. On amirita ayudadi sowaka.”
  
  *Eko Text for Midday Sutra Chanting:* “Having just chanted the Compliant Heart Mantra Victor, we dedicate this merit to the Three Jewels, and to the good fortune of our household. We pray for a peaceful home, for a stable lay practice, and for auspicious conditions for all. Ji ho san shi i shi fu, shi son bu sa mo ko sa, mo ko ho ja ho ro mi.”