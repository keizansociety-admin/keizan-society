title: "LAY UPOSATHA (BI-MONTHLY CONFESSION)"
body: |
  *Instructions: On the 15th and last day of the month, during the Evening Service, stand before your home altar with hands in gassho and recite the following sequence before sitting Zazen.*

  **1. The Repentance (Sange mon)**
  “All my past and harmful karma, born from beginningless greed, hate, and delusion, through body, speech, and mind, I now fully avow.” *(Bow once).*

  **2. The Three Refuges (Sankie mon)**
  “I take refuge in Buddha. I take refuge in Dharma. I take refuge in Sangha.
  I take refuge in Buddha, honored as the highest;
  I take refuge in Dharma, honored as the stainless;
  I take refuge in Sangha, honored as harmonious.
  I have completely taken refuge in Buddha;
  I have completely taken refuge in Dharma;
  I have completely taken refuge in Sangha.”

  **3. The Threefold Pure Precepts**
  “I vow to embrace all moral codes.
  I vow to embrace all good acts.
  I vow to embrace and benefit all living beings.”

  **4. The Ten Major Precepts**
  “I vow not to kill.
  I vow not to steal.
  I vow not to indulge in sexual greed.
  I vow not to speak falsehood.
  I vow not to deal in intoxicants.
  I vow not to talk of the faults of others.
  I vow not to praise myself nor slander others.
  I vow not to begrudge the dharma or materials.
  I vow not to harbor anger.
  I vow not to slander the Three Treasures.”

  **5. The Sealing Verse (Sho sekai bon no ge)**
  “Abiding in this ephemeral world like a lotus in muddy water, the mind is pure and goes beyond. Thus we bow to Buddha.”

  *(Perform one final deep bow to the altar, then take your seat for Zazen).*
