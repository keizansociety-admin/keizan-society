title: "TOILET"
body: |
  *Offer incense to the bathroom altar and bow.* “Going to the toilet, the Bodhisattva inspires all beings to reject greed, hatred, and ignorance, and cleanse all transgressions.”
  
  *When washing the hands,* “Using water to wash the hands, the Bodhisattva inspires all beings to obtain pure hands to receive and uphold the Buddha-Dharma.”