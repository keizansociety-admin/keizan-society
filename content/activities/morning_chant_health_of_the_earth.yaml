title: "PRAYERS SUTRA CHANTING"
body: |
  *Turn to sit facing the altar. Offer incense. Recite seven times,* “Gya tei gya tei. Ha ra gya tei. Hara so gya tei. Bo ji sowa ka.”
  
  *Eko Text for Morning Sutra Chanting:* “We dedicate this gathered merit to the pure body of the dharma realm. We pray for the vibrant health of the Earth, for the healing of our natural world, and for the peaceful harmony of all life. Ji ho san shi i shi fu, shi son bu sa mo ko sa, mo ko ho ja ho ro mi.”
  
  *Three Prostrations.*