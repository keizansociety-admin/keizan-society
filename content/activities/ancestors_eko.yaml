title: "ANCESTORS EKO"
body: |
  The clear, cool moon of the bodhisattva floats in the sky of utter emptiness； in the pure water of the mind of beings, the reflection of bodhi will appear. We humbly beg the three treasures for their illumination. Having chanted the Great Compassion Dharani, we offer the merit generated thereby to the spirits of ancestors and deceased family members of this household, to the six close kin and seven generations of parents, and to all sentient beings of the dharma realm, including the myriad spirits of the triple world both with and without connections to the living. What we pray for is that their delusion of long kalpas will now be extinguished, that the marvelous wisdom of true emptiness will hereby appear, and that they will immediately comprehend the uncreated and quickly confirm the fruit of Buddhahood.

  ◎ ji ho san shi i shi fu 
  shi son bu sa mo ko sa 
  ◎ mo ko ho ja ho ro mi