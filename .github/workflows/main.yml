name: Daily Practice Update
on:
  schedule:
    - cron: '0 5 * * *' # Runs at Midnight EST
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Generate Post
        run: python web_generator.py
      - name: Commit and Push
        run: |
          git config --global user.name "KeizanBot"
          git config --global user.email "bot@keizansociety.org"
          git add _posts/
          git commit -m "Daily Practice Update" || exit 0
          git push
