name: Daily Practice Update
on:
  schedule:
    - cron: '0 5 * * *' # Midnight EST
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly gives permission to save files
    steps:
      - uses: actions/checkout@v4 # Updated to v4
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.10'
      - name: Generate Post
        run: python web_generator.py
      - name: Commit and Push
        run: |
          git config --global user.name "KeizanBot"
          git config --global user.email "bot@keizansociety.org"
          git add _posts/
          # This line prevents the error if there are no changes to save
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily Practice Update" && git push)
