name: Zen Missal Generator

on:
  schedule:
    # This runs at 07, 22, and 47 minutes past the hour
    # ONLY during the hours of 4, 5, 6, 7, 8, and 9 UTC.
    # (This covers roughly 11 PM to 5 AM in New York)
    - cron: '7,22,47 4-9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for diagnostics
        run: ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml pytz

      - name: Run the Generator
        run: python generator.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Liturgical Update" || exit 0
          git push
