name: Zen Missal Generator

on:
  schedule:
    # Focuses runs between roughly 11 PM and 5 AM New York Time.
    # Uses "off-peak" minutes (07, 22, 47) to avoid GitHub traffic jams.
    - cron: '7,22,47 4-9 * * *'
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for diagnostics
        run: ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml pytz

      - name: Run the Generator
        run: python generator.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html output/index.html
          # Adding the date to the message ensures the commit is always unique
          git commit -m "Liturgical Update: $(date)" || exit 0
          git push
