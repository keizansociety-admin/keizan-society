name: Zen Missal Generator

on:
  schedule:
    - cron: '12 4 * * *'  # 12:12 AM EST (A non-standard minute is more reliable)
    - cron: '30 5 * * *'  # 1:30 AM EST (A backup run in case the first is skipped)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml pytz

      - name: Run the Generator
        run: python web_generator.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Liturgical Update" || exit 0
          git push
