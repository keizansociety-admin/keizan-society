name: Zen Missal Generator

on:
  schedule:
    - cron: '7,22,47 4-9 * * *'
  push:
    branches:
      - main
  workflow_dispatch: 

# This block gives the runner permission to deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml pytz

      - name: Run the Generator
        run: python generator.py

      # This step "packages" your files so the deployer can find them
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This tells GitHub to grab the whole folder
          path: '.' 

      # We keep this so you can still see the file changes in your repo
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html output/index.html
          git commit -m "Liturgical Update: $(date)" || exit 0
          git push

  deploy:
    # This job only runs after the 'build' job finishes successfully
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
