name: Zen Missal Generator

on:
  schedule:
    - cron: '5 4 * * *' # Runs daily at approx midnight EST
  workflow_dispatch: # Adds the manual "Run" button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml pytz

      - name: Run the Generator
        run: python web_generator.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Liturgical Update" || exit 0
          git push
